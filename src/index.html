<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>CrazyBaby</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <a
          href="#"
          class="header__logo"
        >
          <img
            src="./images/icons/logo.svg"
            alt="CrazyBaby"
            class="header__logo-image"
          />
        </a>

        <nav class="header__nav">
          <a
            href="#specs"
            class="header__link"
          >
            Specs
          </a>

          <div class="header__lang">
            <a
              href="#"
              class="header__lang-link header__lang-link--active"
            >
              EN
            </a>
            <span class="header__lang-divider">/</span>
            <a
              href="#"
              class="header__lang-link"
            >
              UA
            </a>
          </div>

          <a
            href="#contacts"
            class="header__buy"
          >
            Buy
          </a>
        </nav>

        <button
          type="button"
          class="header__burger"
        >
          <img
            src="./images/icons/burger.svg"
            alt="Menu"
            class="header__burger-icon"
          />
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero__container">
          <div class="hero__text">
            <h1 class="hero__title">Futuristic Wireless Speaker</h1>
            <p class="hero__description">
              Luna’s performance is balanced and smooth in all frequency ranges
              which makes the music both naturally pleasant and distinctly more
              layered.
            </p>
          </div>

          <picture class="hero__picture">
            <source
              media="(min-width: 1280px)"
              srcset="./images/hero-desktop.png"
              width="816"
              height="464"
            />
            <source
              media="(min-width: 768px)"
              srcset="./images/hero-tablet.png"
              width="430"
              height="317"
            />
            <img
              src="./images/hero-mobile.png"
              alt="Luna wireless speakers"
              width="320"
              height="245"
              class="hero__image"
            />
          </picture>
        </div>
      </section>
    </main>

    <script src="scripts/main.js"></script>
  </body>
</html>
